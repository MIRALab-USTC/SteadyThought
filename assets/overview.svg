<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">SteadyThought overview</title>
  <desc id="description">SteadyThought has three stages: Identification of Thought Switching Points, Trajectory Synthesis at Switching Points, and Fine-Grained Preference Optimization. Linguistic markers and entropy signals identify thought switch points, persistent continuations are synthesized using logit control, and thought-level preferences support training.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#f6f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="49" font-size="26" font-weight="700" fill="#17243b">From Thought Switching to Steadier Reasoning</text>
    <text x="600" y="78" font-size="17" fill="#526176">Identify thought switch points · synthesize trajectories · optimize thought-level preferences</text>

    <rect x="40" y="113" width="330" height="220" rx="18" fill="#eaf2ff" stroke="#7b9fd2" stroke-width="2"/>
    <text x="205" y="145" font-size="22" font-weight="700" fill="#19375c">1. Identification of</text>
    <text x="205" y="173" font-size="22" font-weight="700" fill="#19375c">Thought Switching Points</text>
    <text x="205" y="210" font-size="17" fill="#39516e">Linguistic markers + entropy spikes</text>
    <text x="205" y="239" font-size="18" fill="#39516e">Identify thought switch points</text>
    <path d="M 76 299 L 94 293 L 114 298 L 132 287 L 149 293 L 164 268 L 178 298 L 198 290 L 218 297 L 239 263 L 253 296 L 276 288 L 294 295 L 332 286" fill="none" stroke="#638bc5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="164" cy="268" r="5" fill="#315f9f"/>
    <circle cx="239" cy="263" r="5" fill="#315f9f"/>

    <path d="M 374 225 H 426" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="435" y="113" width="330" height="220" rx="18" fill="#fff5d9" stroke="#d5ac46" stroke-width="2"/>
    <text x="600" y="145" font-size="22" font-weight="700" fill="#604919">2. Trajectory Synthesis</text>
    <text x="600" y="173" font-size="22" font-weight="700" fill="#604919">at Switching Points</text>
    <text x="600" y="210" font-size="19" fill="#6b5831">Question + selected thought</text>
    <text x="600" y="239" font-size="18" fill="#6b5831">Logit-controlled continuation</text>
    <rect x="458" y="265" width="284" height="35" rx="17" fill="#f7e6ac"/>
    <text x="600" y="288" font-size="16" font-weight="600" fill="#70541b">Suppress unnecessary switching</text>

    <path d="M 769 225 H 821" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="830" y="113" width="330" height="220" rx="18" fill="#eaf7ef" stroke="#78b58e" stroke-width="2"/>
    <text x="995" y="145" font-size="22" font-weight="700" fill="#234d37">3. Fine-Grained</text>
    <text x="995" y="173" font-size="22" font-weight="700" fill="#234d37">Preference Optimization</text>
    <text x="995" y="210" font-size="18" fill="#42604d">Shared question + thought prefix</text>
    <rect x="850" y="228" width="290" height="33" rx="8" fill="#d3ebdc"/>
    <text x="995" y="250" font-size="18" fill="#244e36">chosen · correct synthesis</text>
    <rect x="850" y="271" width="290" height="33" rx="8" fill="#f1f4f2"/>
    <text x="995" y="293" font-size="18" fill="#465c4e">rejected · original continuation</text>

    <path d="M 995 336 V 388 H 830" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="375" y="360" width="450" height="58" rx="29" fill="#17243b"/>
    <text x="600" y="396" font-size="23" font-weight="700" fill="#ffffff">STPO data → Training</text>
  </g>
</svg>
