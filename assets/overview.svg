<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">SteadyThought overview</title>
  <desc id="description">Three stages construct thought-level preference data: identify thought boundaries from token entropy, synthesize controlled continuations from each selected thought, and pair correct synthesized continuations with original continuations. The data can then be used for SimPO training in LLaMA-Factory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#f6f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="49" font-size="26" font-weight="700" fill="#17243b">From Thought Switching to Steadier Reasoning</text>
    <text x="600" y="78" font-size="17" fill="#526176">Identify thought boundaries · synthesize continuations · build preferences</text>

    <rect x="40" y="113" width="330" height="194" rx="18" fill="#eaf2ff" stroke="#7b9fd2" stroke-width="2"/>
    <text x="205" y="153" font-size="23" font-weight="700" fill="#19375c">1. Thought identification</text>
    <text x="205" y="189" font-size="19" fill="#39516e">Original model responses</text>
    <text x="205" y="220" font-size="18" fill="#39516e">Token entropy → thought boundaries</text>
    <path d="M 76 274 L 94 268 L 114 273 L 132 262 L 149 268 L 164 243 L 178 273 L 198 265 L 218 272 L 239 238 L 253 271 L 276 263 L 294 270 L 332 261" fill="none" stroke="#638bc5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="164" cy="243" r="5" fill="#315f9f"/>
    <circle cx="239" cy="238" r="5" fill="#315f9f"/>

    <path d="M 374 211 H 426" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="435" y="113" width="330" height="194" rx="18" fill="#fff5d9" stroke="#d5ac46" stroke-width="2"/>
    <text x="600" y="153" font-size="23" font-weight="700" fill="#604919">2. Trajectory synthesis</text>
    <text x="600" y="189" font-size="19" fill="#6b5831">Question + selected thought</text>
    <text x="600" y="220" font-size="19" fill="#6b5831">Controlled continuation</text>
    <rect x="458" y="244" width="284" height="35" rx="17" fill="#f7e6ac"/>
    <text x="600" y="267" font-size="16" font-weight="600" fill="#70541b">Suppress unnecessary switching</text>

    <path d="M 769 211 H 821" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="830" y="113" width="330" height="194" rx="18" fill="#eaf7ef" stroke="#78b58e" stroke-width="2"/>
    <text x="995" y="153" font-size="23" font-weight="700" fill="#234d37">3. Preference construction</text>
    <text x="995" y="189" font-size="18" fill="#42604d">Shared question + thought prefix</text>
    <rect x="850" y="207" width="290" height="33" rx="8" fill="#d3ebdc"/>
    <text x="995" y="229" font-size="18" fill="#244e36">chosen · correct synthesis</text>
    <rect x="850" y="250" width="290" height="33" rx="8" fill="#f1f4f2"/>
    <text x="995" y="272" font-size="18" fill="#465c4e">rejected · original continuation</text>

    <path d="M 995 310 V 365 H 830" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="375" y="337" width="450" height="58" rx="29" fill="#17243b"/>
    <text x="600" y="373" font-size="23" font-weight="700" fill="#ffffff">STPO data → SimPO training</text>
    <text x="600" y="421" font-size="17" fill="#526176">Ready for LLaMA-Factory · no custom training framework required</text>
  </g>
</svg>
